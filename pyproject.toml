[project]
name = "optmanage"
dynamic = ["version"]
authors = [{ name = "Hashberg" }]
description = "A library to create flexible option managers."
readme = "README.md"
requires-python = ">=3.15"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["typing-validation>=2.2.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://optmanage.readthedocs.io"
Repository = "https://github.com/hashberg-io/optmanage"
Issues = "https://github.com/hashberg-io/optmanage/issues"

[build-system]
requires = ["hatchling == 1.30.1"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py315"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.version]
path = "src/optmanage/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["src/optmanage"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/optmanage", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = ["mypy", "black", "pytest"]
